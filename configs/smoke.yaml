# Fast sanity-check configuration; should finish in well under a minute.
reconstruction_demo:
  truth_mesh_n: 24
  inv_mesh_n: 12
  sensor_grid: 3
  sensor_width: 0.04
  relative_noise: 0.02
  alpha: 10.0
  max_iter: 30

regularization_study:
  truth_mesh_n: 24
  inv_mesh_n: 12
  sensor_grid: 4
  sensor_width: 0.04
  relative_noise: 0.02
  alphas: [1.0e-2, 1.0, 1.0e+1, 1.0e+2, 1.0e+3, 1.0e+4]
  max_iter: 30

noise_study:
  truth_mesh_n: 24
  inv_mesh_n: 12
  sensor_grid: 4
  sensor_width: 0.04
  alpha: 10.0
  relative_noise_levels: [0.0, 0.05, 0.2]
  max_iter: 30

sensor_study:
  truth_mesh_n: 24
  inv_mesh_n: 12
  sensor_width: 0.04
  relative_noise: 0.02
  alpha: 10.0
  sensor_grids: [2, 4]
  max_iter: 30
