name: Scientific CI
on:
  push:
    branches: [main, "ci/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      OMP_NUM_THREADS: '1'
      OPENBLAS_NUM_THREADS: '1'
      MKL_NUM_THREADS: '1'
      NUMEXPR_NUM_THREADS: '1'
    steps:
      - uses: actions/checkout@v4
      - uses: conda-incubator/setup-miniconda@v3
        with:
          miniforge-version: latest
          activate-environment: fenicsx
          environment-file: environment.yml
          auto-activate-base: false
      - name: Syntax check
        shell: bash -el {0}
        run: python -m compileall -q src tests scripts
      - name: Scientific unit tests
        shell: bash -el {0}
        run: |
          echo "Python: $(command -v python)"
          python -c 'import sys; print(sys.executable)'
          python -u -c 'import mpi4py.MPI; print("MPI import OK", flush=True)'
          python -u -c 'import petsc4py.PETSc; print("PETSc import OK", flush=True)'
          python -u -c 'import dolfinx; print("dolfinx import OK", flush=True)'
          python -m pytest --collect-only -q tests
          python -m pytest -q tests
